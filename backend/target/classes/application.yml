server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: card-game-backend

  datasource:
    # ============================================================
    #  【数据库接入配置】在这里填入你自己的 MySQL 账号密码
    #  方式一（推荐）：直接改下面的默认值
    #  方式二：设环境变量 DB_USERNAME / DB_PASSWORD，不改代码
    # ============================================================
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:card_game}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

card:
  # ============================================================
  #  静态用户数据开关
  #    true  : 数据库不可用时，登录/查询用户自动回退到内置测试账号
  #            （账号：admin/admin123、guest/guest123）
  #    false : 只走真实数据库，不使用静态数据
  #  数据库配好后建议设为 false
  # ============================================================
  use-static-user: ${CARD_USE_STATIC_USER:true}

  jwt:
    # 生产环境务必改成随机长字符串，可通过环境变量 JWT_SECRET 注入
    secret: ${JWT_SECRET:card-game-competition-2026-secret-key-change-me-please-32bytes}
    # 令牌有效期（秒），默认 7 天
    expire-seconds: 604800

# 跨域：小程序开发者工具调试阶段放行全部，正式发布建议收紧白名单
card.cors:
  allowed-origin-patterns: "*"

logging:
  level:
    com.cardgame: debug
